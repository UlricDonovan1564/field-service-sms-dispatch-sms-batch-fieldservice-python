[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "field-service-sms-dispatch"
version = "0.1.0"
description = "Typed Python service for field-service SMS campaigns and per-message delivery status."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/field_dispatch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
